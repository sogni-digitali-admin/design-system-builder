<!doctype html>
<html lang="{{LANG}}" data-theme="light" data-lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} · Design system</title>
<meta name="description" content="{{DESCRIPTION}}">
<script>{{HEAD_JS}}</script>
<style>
{{FONT_FACES}}
/* ===================================================================== TOKENS (generated from ds.config.json) */
{{TOKENS_CSS}}
/* ===================================================================== DOC */
{{BASE_CSS}}
/* ===================================================================== ICON MOTION */
{{ICON_MOTION_CSS}}
/* ===================================================================== SECTIONS */
{{PARTS_CSS}}
</style>
</head>
<body>
<a class="skip" href="#main">↓</a>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#top" aria-label="{{NAME}} — {{UI_TOP}}">{{LOGO_LIGHT}}{{LOGO_DARK}}<span class="brand-sub">design system</span></a>
    <nav class="nav" aria-label="{{UI_CONTENTS}}">{{TOPNAV}}</nav>
    <a class="btn btn-ghost top-dl" href="design.md" download>design.md</a>
    {{LANG_SWITCH}}
    <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" title="{{UI_TOGGLE}}">
      <svg class="ic tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic tt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <span class="lbl">{{UI_LIGHT}}</span>
    </button>
  </div>
</header>

<div class="layout">
<aside class="side" aria-label="{{UI_CONTENTS}}"><nav>{{SIDENAV}}</nav>
  <div class="side-foot"><span>{{NAME}} · v{{VERSION}} · {{DATE}}</span></div>
</aside>

<main id="main" class="main">
<span id="top"></span>
{{SECTIONS}}
<footer>{{NAME}} · design system v{{VERSION}} · {{DATE}}</footer>
</main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

{{HAIRLINE}}
<script>{{PARTS_JS}}</script>
<script>{{RUNTIME_JS}}</script>
</body>
</html>
