<!doctype html>
<html lang="{{LANG}}" data-theme="light" data-lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} · Design system</title>
<meta name="description" content="{{DESCRIPTION}}">
<script>{{HEAD_JS}}</script>
<style>
{{FONT_FACES}}
/* ===================================================================== TOKENS (generated from ds.config.json) */
{{TOKENS_CSS}}
/* ===================================================================== DOC */
{{BASE_CSS}}
/* ===================================================================== ICON MOTION */
{{ICON_MOTION_CSS}}
/* ===================================================================== SECTIONS */
{{PARTS_CSS}}
</style>
</head>
<body>
<a class="skip" href="#main">↓</a>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#top" aria-label="{{NAME}} — {{UI_TOP}}">{{LOGO_LIGHT}}{{LOGO_DARK}}<span class="brand-sub">design system</span></a>
    <nav class="nav" aria-label="{{UI_CONTENTS}}">{{TOPNAV}}</nav>
    <a class="btn btn-ghost top-dl" href="design.md" download>design.md</a>
    {{LANG_SWITCH}}
    {{THEME_CONTROL}}
  </div>
</header>

<div class="layout">
<aside class="side" aria-label="{{UI_CONTENTS}}">{{SIDE_FILTER}}<nav id="side-nav">{{SIDENAV}}</nav>
  <div class="side-foot"><span>{{NAME}} · v{{VERSION}} · {{DATE}}</span></div>
</aside>

<main id="main" class="main">
<span id="top"></span>
{{SECTIONS}}
<footer>{{NAME}} · design system v{{VERSION}} · {{DATE}}</footer>
</main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

{{HAIRLINE}}
<script>{{PARTS_JS}}</script>
<script>{{RUNTIME_JS}}</script>
</body>
</html>
